<section class="resume-section min-height p-3 p-lg-5 d-flex flex-column" id="skills">
  <div class="my-auto" id="skills-content">
    <h2 class="mb-5">Skills</h2>
    {{ range $index, $value := hugo.Data.skills.members }}
      <div class="subheading mb-3 skills-heading">{{ .grouping }}</div>
      <ul class="list-inline skills-list">
      {{ range .skills }}
        {{ if reflect.IsMap . }}
          <li class="list-inline-item skill-badge">
            <i class="{{ .icon }}"></i>
            {{ if isset . "link" }}
                <a href="{{ .link }}" target="_blank" rel="noopener">{{ .name }}</a>
            {{ else }}
                <span>{{ .name }}</span>
            {{ end }}
          </li>
        {{ else }}
          <li class="list-inline-item skill-badge">
            <i class="fa-solid fa-code"></i>
            <span>{{ . }}</span>
          </li>
        {{ end }}
      {{ end }}
      </ul>
    {{ end }}
  </div>
</section>
